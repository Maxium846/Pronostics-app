# Profil de production : AUCUN secret écrit ici.
# Les valeurs arrivent par variables d'environnement. Si l'une manque, Spring refuse de démarrer
# (c'est voulu : mieux vaut un échec visible qu'un démarrage avec une valeur par défaut dangereuse).

# --- Base de données ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- La structure de la base est gérée uniquement par Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# --- CORS : vide par défaut (front et API sous le même domaine, derrière le proxy) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Logs sobres ---
logging.level.root=INFO
logging.level.com.pronoleague=INFO

# --- Ne jamais révéler de détails internes dans les réponses d'erreur ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Actuator : seulement la santé, sans détails ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
